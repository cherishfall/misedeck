<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app icon, not a template logo: this is the file the webview
         (dev window / task switcher) shows wherever it reads a favicon.
         public/favicon.png is a copy of src-tauri/icons/128x128.png. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted (src/fonts.css, issue #241). The previous
         Google Fonts <link> was never loaded: the app's CSP is
         `default-src 'self'`, so style-src/font-src rejected the remote
         origin — every platform silently fell back to its own system
         stack. Bundling also removes the runtime network dependency. -->
    <title>MiseDeck</title>
    <script>
      // Theme bootstrap (#37, #54): read the persisted theme
      // (light / dark, default light — fully manual, no system mode)
      // and set `html[data-theme]` before first paint, so tokens.css
      // never flashes the wrong theme. Values persisted by older builds
      // (`system`, or anything unknown) migrate to light. The
      // ThemeProvider (`src/state/themeContext.tsx`) takes over after
      // React mounts.
      (function () {
        var theme = "light";
        try {
          var stored = window.localStorage.getItem("misedeck.theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          }
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
