<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>MiseDeck</title>
    <script>
      // Theme bootstrap (#37, #54): read the persisted theme
      // (light / dark, default light — fully manual, no system mode)
      // and set `html[data-theme]` before first paint, so tokens.css
      // never flashes the wrong theme. Values persisted by older builds
      // (`system`, or anything unknown) migrate to light. The
      // ThemeProvider (`src/state/themeContext.tsx`) takes over after
      // React mounts.
      (function () {
        var theme = "light";
        try {
          var stored = window.localStorage.getItem("misedeck.theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          }
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
