<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app icon, not a template logo: this is the file the webview
         (dev window / task switcher) shows wherever it reads a favicon.
         public/favicon.png is a copy of src-tauri/icons/128x128.png. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted (src/fonts.css, issue #241). The previous
         Google Fonts <link> was never loaded: the app's CSP is
         `default-src 'self'`, so style-src/font-src rejected the remote
         origin — every platform silently fell back to its own system
         stack. Bundling also removes the runtime network dependency. -->
    <title>MiseDeck</title>
    <!-- Theme bootstrap (#37, #54) lives in public/theme-bootstrap.js and
         loads as a classic head script so it still runs before first
         paint. It must not be inline: the bundled app ships under
         `default-src 'self'`, which blocks inline <script> blocks only
         in release (issue #290). -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
