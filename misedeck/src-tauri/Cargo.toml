[package]
name = "misedeck"
version = "1.0.0-beta.16"
description = "MiseDeck — a faithful GUI for mise"
authors = ["cherishfall"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "misedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
# Cross-platform home-directory resolution (HOME on unix, known folders on
# Windows). Already in the lockfile as a tauri transitive; promoted to a
# direct dependency to anchor Global-mode runs at $HOME (issue #179).
dirs = "6"
tauri-plugin-clipboard-manager = "2.3.3"
# Ordering for the app's own update check (issue #236): `1.0.0-beta.17`
# must beat `1.0.0-beta.16`, and a final release must beat its own
# prereleases — semver's Ord is exactly the spec. Already in the lockfile
# as a tauri transitive, so promoting it to a direct dependency compiles
# nothing new.
semver = "1"

# macOS-only: used to bridge the WKWebView into the macOS accessibility tree
# (see issue #53). Gated to macOS so non-Apple builds never pull it in.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Unix-only process-tree control (issue #223): `setsid()` in the child
# before exec and `killpg()` on cancel/timeout/quit. Already in the
# lockfile as a tauri transitive; promoted to a direct dependency so the
# two calls are not reached through a crate we do not own.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
