name: ci

# Cheap frontend + Rust checks on every push to master and on every PR.
# The full tag-triggered build lives in release.yml — this workflow
# keeps master green without paying for a Tauri bundle on every commit.
# Target wall-clock: under 5 minutes on a warm cache for the Ubuntu
# legs; the Windows smoke job runs a cold Rust build and is slower.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per ref at a time; cancel superseded runs on the same ref so
# a force-push doesn't pay for the previous run's tests.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only is enough: no release, no deployment.
permissions:
  contents: read

jobs:
  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Frontend behavior can differ subtly between Windows path
        # handling and POSIX shells; keep the cheap checks honest by
        # covering at least two. macOS catches shell portability too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: misedeck/package-lock.json

      - name: Install npm dependencies
        working-directory: misedeck
        run: npm ci

      - name: TypeScript typecheck
        working-directory: misedeck
        run: npx tsc --noEmit

      - name: React Hooks lint (zero warnings)
        working-directory: misedeck
        run: npm run lint:eslint

      - name: Frontend tests
        working-directory: misedeck
        run: npm run test

      - name: i18n parity + call-site guard
        working-directory: misedeck
        run: npm run lint:i18n

      - name: i18n string-concatenation guard
        working-directory: misedeck
        run: npm run lint:i18n-concat

      - name: CSS design-token reference check
        working-directory: misedeck
        run: npm run lint:css-tokens

      - name: CSS font-size token check
        working-directory: misedeck
        run: npm run lint:css-font-size

      - name: CSS spacing token check
        working-directory: misedeck
        run: npm run lint:css-spacing

      - name: CSS letter-spacing token check
        working-directory: misedeck
        run: npm run lint:css-tracking

      - name: i18n ellipsis guard
        working-directory: misedeck
        run: npm run lint:i18n-ellipsis

      - name: Command-hint guard
        working-directory: misedeck
        run: npm run lint:command-hint

      # The guided-install echo (TS) and the command the Rust executor
      # spawns must be the same per-platform line (issue #229).
      - name: Install-echo parity guard
        working-directory: misedeck
        run: npm run lint:install-echo-parity

      # The tools-page argv is dispatched from TS and mirrored by the
      # Rust builders; both halves are pinned to one case table, with
      # the Rust half in `cargo test` (issue #255).
      - name: Tools-page argv parity guard
        working-directory: misedeck
        run: npm run lint:argv-parity

      - name: Frontend production build
        working-directory: misedeck
        run: npm run build

  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: misedeck/src-tauri -> target
          cache-on-failure: true

      - name: cargo check
        working-directory: misedeck/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: misedeck/src-tauri
        run: cargo test --all-targets

  # Windows is a beta target with no real machine in the review loop
  # (issue #208): this job is the only place the Windows code paths
  # actually execute. The `frontend` job above already covers the npm
  # checks on Windows; this one adds the Rust side plus the Tauri
  # compile smoke, which is what broke-by-construction `locate_mise`
  # needed. Bundling stays out — see the last step.
  windows:
    name: windows (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: misedeck/package-lock.json

      - name: Install npm dependencies
        working-directory: misedeck
        run: npm ci

      # Also produces `misedeck/dist`, which the Tauri context macro
      # needs at compile time — so this must run before `cargo build`.
      - name: Frontend checks
        working-directory: misedeck
        run: npm run ci

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: misedeck/src-tauri -> target
          cache-on-failure: true

      # `--lib`: the integration suite drives a bash fixture script
      # (`tests/fixtures/mise/fixture-mise`) through `Command::new`,
      # which Windows cannot execute. That coverage stays on the Ubuntu
      # leg; the #208 candidate-path tests are unit tests and run here.
      - name: cargo test
        working-directory: misedeck/src-tauri
        run: cargo test --lib

      # Compile smoke, deliberately `cargo build` and not
      # `npm run tauri build`: Windows bundling pulls NSIS/WiX, is slow
      # and flaky, and packaging is the owner's release-time call
      # (beta.15 ships without Windows packages). Compiling the crate +
      # Tauri glue is what this job actually needs to prove.
      - name: cargo build (compile smoke)
        working-directory: misedeck/src-tauri
        run: cargo build
