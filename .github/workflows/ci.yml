name: ci

# Cheap frontend + Rust checks on every push to master and on every PR.
# The full tag-triggered build lives in release.yml — this workflow
# keeps master green without paying for a Tauri bundle on every commit.
# Target wall-clock: under 5 minutes on a warm cache for the Ubuntu
# legs; the Windows smoke job runs a cold Rust build and is slower.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per ref at a time; cancel superseded runs on the same ref so
# a force-push doesn't pay for the previous run's tests.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only is enough: no release, no deployment.
permissions:
  contents: read

jobs:
  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Frontend behavior can differ subtly between Windows path
        # handling and POSIX shells; keep the cheap checks honest by
        # covering at least two. macOS catches shell portability too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: misedeck/package-lock.json

      - name: Install npm dependencies
        working-directory: misedeck
        run: npm ci

      - name: TypeScript typecheck
        working-directory: misedeck
        run: npx tsc --noEmit

      - name: React Hooks lint (zero warnings)
        working-directory: misedeck
        run: npm run lint:eslint

      - name: Frontend tests
        working-directory: misedeck
        run: npm run test

      - name: i18n parity + call-site guard
        working-directory: misedeck
        run: npm run lint:i18n

      - name: i18n string-concatenation guard
        working-directory: misedeck
        run: npm run lint:i18n-concat

      - name: CSS design-token reference check
        working-directory: misedeck
        run: npm run lint:css-tokens

      - name: CSS font-size token check
        working-directory: misedeck
        run: npm run lint:css-font-size

      - name: CSS spacing token check
        working-directory: misedeck
        run: npm run lint:css-spacing

      - name: CSS letter-spacing token check
        working-directory: misedeck
        run: npm run lint:css-tracking

      - name: i18n ellipsis guard
        working-directory: misedeck
        run: npm run lint:i18n-ellipsis

      - name: Command-hint guard
        working-directory: misedeck
        run: npm run lint:command-hint

      # The guided-install echo (TS) and the command the Rust executor
      # spawns must be the same per-platform line (issue #229).
      - name: Install-echo parity guard
        working-directory: misedeck
        run: npm run lint:install-echo-parity

      # The tools-page argv is dispatched from TS and mirrored by the
      # Rust builders; both halves are pinned to one case table, with
      # the Rust half in `cargo test` (issue #255).
      - name: Tools-page argv parity guard
        working-directory: misedeck
        run: npm run lint:argv-parity

      - name: Frontend production build
        working-directory: misedeck
        run: npm run build

      # Release-note resolution is shell logic that runs only on a tag
      # push; exercise it here so a regression fails on master (#266).
      - name: Release-notes resolution check
        if: runner.os == 'Linux'
        run: bash scripts/test-release-notes.sh

  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: misedeck/src-tauri -> target
          cache-on-failure: true

      - name: cargo check
        working-directory: misedeck/src-tauri
        run: cargo check --all-targets

      # Style + cfg lints are warnings by default; `-D warnings` turns the
      # gate on (issue #278). Keep this before `cargo test` so a lint
      # failure reports as a lint, not as a mystery later step.
      - name: cargo clippy (zero warnings)
        working-directory: misedeck/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: misedeck/src-tauri
        run: cargo test --all-targets

      # When a test fails, the raw `cargo test` output buries the
      # failing test names in a wall of `running N tests` lines. This
      # step re-runs the suite once and prints only the digest — the
      # names, then the panic sites — so the log says *which* test
      # broke without a scroll.
      #
      # Body is a block scalar on purpose: a one-line `run:` that greps
      # for `failures:` contains `: ` mid-value, which is invalid YAML
      # and silently turns the whole workflow file into "Invalid
      # workflow file" (the run then fails in zero seconds without ever
      # starting a job).
      #
      # The same digest goes to `$GITHUB_STEP_SUMMARY`, which the run
      # page renders at the top — one click instead of downloading logs.
      - name: Test failure summary
        if: failure()
        working-directory: misedeck/src-tauri
        shell: bash
        run: |
          log="$RUNNER_TEMP/cargo-test-failures.log"
          cargo test --all-targets --no-fail-fast >"$log" 2>&1 || true
          {
            echo '=== failing tests ==='
            grep -A 100 -E '^failures:$' "$log" || true
            echo '=== panic sites ==='
            grep -B 2 -A 12 'panicked at' "$log" || true
          } | tee "$RUNNER_TEMP/failure-digest.txt"
          {
            echo '## Failing tests'
            echo
            echo '```'
            cat "$RUNNER_TEMP/failure-digest.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # The raw log needs repository admin rights to download; an
          # annotation does not. Re-emit the digest (first 6 KiB — the
          # runner caps a single annotation well below this) so the
          # failure is readable through the checks API as well as in
          # the browser. `%` and CR/LF are escaped per the runner's
          # property protocol.
          digest=$(head -c 6000 "$RUNNER_TEMP/failure-digest.txt")
          digest=${digest//'%'/'%25'}
          digest=${digest//$'\r'/}
          digest=${digest//$'\n'/'%0A'}
          echo "::error title=Failing tests::${digest}"

  # Windows is a beta target (issue #208). This job is the place the
  # Windows code paths actually execute: the `frontend` job above covers
  # the npm checks on Windows; this one adds the Rust side plus the
  # Tauri compile smoke, which is what broke-by-construction
  # `locate_mise` needed. Bundling stays out — see the last step.
  #
  # The integration suite runs here too, since the fixtures are
  # cross-platform Rust binaries rather than bash scripts. Bundling
  # stays out of every leg — see the last step.
  windows:
    name: windows (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: misedeck/package-lock.json

      - name: Install npm dependencies
        working-directory: misedeck
        run: npm ci

      # Also produces `misedeck/dist`, which the Tauri context macro
      # needs at compile time — so this must run before `cargo build`.
      - name: Frontend checks
        working-directory: misedeck
        run: npm run ci

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: misedeck/src-tauri -> target
          cache-on-failure: true

      # The full suite, integration tests included. The fixtures are
      # cross-platform Rust binaries (`src/bin/fixture-mise.rs`,
      # `src/bin/fixture-process-tree.rs`), not bash scripts: `CreateProcess`
      # on Windows refuses a file with no executable extension (os error
      # 193), which is why this job used to run `cargo test --lib` only.
      # `--no-fail-fast` keeps every target's result visible instead of
      # stopping at the first failure.
      - name: cargo test
        working-directory: misedeck/src-tauri
        run: cargo test --all-targets --no-fail-fast

      # Same failure summary as the ubuntu leg: print the failing test
      # names instead of making the reader dig through the raw output.
      # Block scalar for the same YAML reason as above.
      - name: Test failure summary
        if: failure()
        working-directory: misedeck/src-tauri
        shell: bash
        run: |
          log="$RUNNER_TEMP/cargo-test-failures.log"
          cargo test --all-targets --no-fail-fast >"$log" 2>&1 || true
          {
            echo '=== failing tests ==='
            grep -A 100 -E '^failures:$' "$log" || true
            echo '=== panic sites ==='
            grep -B 2 -A 12 'panicked at' "$log" || true
          } | tee "$RUNNER_TEMP/failure-digest.txt"
          {
            echo '## Failing tests'
            echo
            echo '```'
            cat "$RUNNER_TEMP/failure-digest.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # The raw log needs repository admin rights to download; an
          # annotation does not. Re-emit the digest (first 6 KiB — the
          # runner caps a single annotation well below this) so the
          # failure is readable through the checks API as well as in
          # the browser. `%` and CR/LF are escaped per the runner's
          # property protocol.
          digest=$(head -c 6000 "$RUNNER_TEMP/failure-digest.txt")
          digest=${digest//'%'/'%25'}
          digest=${digest//$'\r'/}
          digest=${digest//$'\n'/'%0A'}
          echo "::error title=Failing tests::${digest}"

      # Compile smoke, deliberately `cargo build` and not
      # `npm run tauri build`: Windows bundling pulls NSIS/WiX, is slow
      # and flaky, and packaging is the owner's release-time call
      # (beta.15 ships without Windows packages). Compiling the crate +
      # Tauri glue is what this job actually needs to prove.
      - name: cargo build (compile smoke)
        working-directory: misedeck/src-tauri
        run: cargo build
