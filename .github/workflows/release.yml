name: release

# Tag pushes (`v*.*.*`) cut a real release. `workflow_dispatch` is a manual
# trigger to exercise the build matrix from a branch without cutting a tag
# (the release job is skipped in that case — see below).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One release at a time per ref. A second tag push waits for the first to
# finish; we never want two matrix runs publishing to the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only for every job: the build legs run `npm ci` and cargo build
# scripts, and none of them needs to write to the repository or a Release.
# The `release` job opts into `contents: write` for its own steps only
# (issue #278).
permissions:
  contents: read

jobs:
  # Issue #287, item 5: the release path used to rest entirely on the
  # discipline "only tag a green master" — `tauri build` runs no tests.
  # Re-running the whole suite inside this workflow would duplicate
  # `ci.yml` (minutes per leg) and only fail *after* the bundles were
  # built, so instead this job asks the cheap question up front: does
  # the tag's commit have a green `ci.yml` run? No green run, no build —
  # the matrix never starts, and the fix costs one API call.
  #
  # Only meaningful for a tag push; a `workflow_dispatch` matrix test
  # from a branch deliberately runs without it.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    # `actions: read` is what the runs endpoint needs; still no writes.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a green ci run for the tagged commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Block scalars on purpose: see the ci.yml note about `: ` in a
          # one-line value silently invalidating the workflow file.
          api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100"
          # Any successful push-triggered run for this exact commit is
          # enough: a cancelled run (superseded by a newer push on the
          # same ref) followed by a manual re-run still counts, and the
          # SHA pins the tree, so a green run of another commit cannot
          # stand in.
          green=$(gh api "$api" --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | length')
          if [ "$green" -gt 0 ]; then
            echo "ci.yml is green for $GITHUB_SHA"
            exit 0
          fi
          echo "::error title=No green ci run::No successful ci.yml push run found for $GITHUB_SHA"
          echo "runs seen for this commit:"
          gh api "$api" --jq '.workflow_runs[] | select(.event == "push") | "  \(.id)  \(.status)/\(.conclusion // "in progress")  \(.html_url)"' || true
          echo
          echo "Tag a commit whose ci.yml run is success, wait for the run to finish, or re-run it: gh run rerun <id>"
          exit 1

  build:
    name: build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      # Continue other legs when one fails so a Windows or Linux breakage
      # is visible in the same run, not hidden behind a cancelled matrix.
      fail-fast: false
      matrix:
        # ubuntu-22.04, not ubuntu-latest (issue #247): the Linux binary
        # links the build host's glibc, so building on 24.04 (glibc 2.39)
        # produced packages that refuse to start on Ubuntu 22.04 (2.35) and
        # Debian 12 (2.36) with "GLIBC_2.39 not found". 22.04 is the
        # oldest LTS with libwebkit2gtk-4.1, and it is Tauri's documented
        # Linux build baseline. `ci.yml` keeps ubuntu-latest — that job is
        # about checking against current dependencies, not portability.
        os: [macos-latest, windows-latest, ubuntu-22.04]
        # Per-platform bundle subset — the Tauri 2 defaults that the
        # host runner can actually produce. The frontend bundle and the
        # Rust binary are always built; this only controls the installers.
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags so the release job can read the tag
          # annotation (used as the release body when present).
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: misedeck/src-tauri -> target
          shared-key: ${{ matrix.os }}
          cache-on-failure: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: misedeck/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install npm dependencies
        working-directory: misedeck
        run: npm ci

      - name: Build Tauri bundle
        working-directory: misedeck
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: misedeck-${{ matrix.os }}
          # Only the installers, not the unpacked `.app` directory on
          # macOS. The `.app` is what gets bundled into the `.dmg` and
          # is too large to attach to a Release. Checksums are computed
          # once in the `release` job, after every platform has landed
          # (#251) — a per-platform file could only ever cover that
          # platform.
          path: |
            misedeck/src-tauri/target/release/bundle/**/*.dmg
            misedeck/src-tauri/target/release/bundle/**/*.exe
            misedeck/src-tauri/target/release/bundle/**/*.msi
            misedeck/src-tauri/target/release/bundle/**/*.deb
            misedeck/src-tauri/target/release/bundle/**/*.rpm
            misedeck/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error

  release:
    name: release
    needs: build
    # Only publish on real tag pushes. workflow_dispatch (manual matrix
    # test) and PR builds never create a Release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Only this job publishes; every build leg stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # One file for the whole release, computed after every platform
          # has landed, over exactly the bytes that get attached (#251).
          #
          # Walk the tree instead of globbing `*`: `download-artifact` with
          # `merge-multiple` keeps the layout each platform uploaded, so the
          # installers sit under dmg/, deb/, rpm/, nsis/ — a top-level glob
          # sees only directories and hashes nothing. Names are printed as
          # bare file names because this file is meant to be checked from
          # the directory the user downloaded into. Sorted by name so
          # re-running the job on the same assets reproduces the file byte
          # for byte.
          find . -type f ! -name SHA256SUMS -print0 \
            | while IFS= read -r -d '' f; do
                printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
              done \
            | sort -k2 > SHA256SUMS
          # Guard the failure that shipped a 0-byte manifest once: an empty
          # file is rejected by the upload API and the release fails anyway.
          test -s SHA256SUMS
          cat SHA256SUMS

      # Resolution rules live in the script so CI can test them against
      # real lightweight and annotated tags (issue #266).
      - name: Resolve release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/resolve-release-notes.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          # Only auto-generate when we have nothing else to put there.
          generate_release_notes: ${{ steps.notes.outputs.source == 'auto' }}
          draft: false
          # Treat alpha/beta/rc/pre tags as pre-releases; stable tags are full releases.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-pre') }}
          # Every file under artifacts/ — the bundles plus the release-wide
          # SHA256SUMS computed above — is attached with its original
          # filename.
          files: |
            artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
